<?php
/**
 * Требуются:
 * $users - список пользователей
 */

$users = lpm_get_users_list();
$isModerator = lpm_is_moderator();
?>
<table class="users-list table">
    <thead>
        <tr>
            <th scope="col"></th>
            <th scope="col">Пользователь</th>
            <?php if ($isModerator): ?>
            <th scope="col">Email</th>
            <?php endif; ?>
            <th scope="col">Последний визит</th>
            <?php if ($isModerator): ?>
            <th scope="col" class="text-center">Операции</th>
            <?php endif; ?>
        </tr>
    </thead>
    <tbody>
        <?php foreach ($users as $user): ?>
        <tr class="<?=$user->isLocked()?'locked-user':'active-user';?> align-middle">
            <td><img class="user-avatar middle" src="<?=$user->getAvatarUrl();?>" /></td>
            <td>
                <?=$user->getLinkedName();?>
                <?php if ($user->isModerator()): ?>
                <span class="badge <?=$user->isAdmin() ? 'bg-danger' : 'bg-primary';?> text-white ms-1"><?=$user->getRoleName();?></span>
                <?php endif; ?>
            </td>
            <?php if ($isModerator): ?>
            <td><?=lpm_escape($user->email);?></td>
            <?php endif; ?>
            <td><?php $lastVisit = $user->getLastVisit(); if ($lastVisit != ''): ?><span title="<?=$user->getLastVisitFull();?>"><?=$lastVisit;?></span><?php endif; ?></td>
            <?php if ($isModerator): ?>
            <td class="text-center">
                <input type="hidden" name="userId" value="<?=$user->userId;?>" />
                <button class="btn btn-secondary" id="unlocked-btn" onclick="usersPage.lockUser(event);">Разблокировать</button>
                <button class="btn btn-danger" id="locked-btn" onclick="usersPage.lockUser(event);">Заблокировать</button>
            </td>
            <?php endif; ?>
        </tr>
        <?php endforeach; ?>
    </tbody>
</table>

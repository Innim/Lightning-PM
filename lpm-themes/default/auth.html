<?php
/*
Требуются: внешних переменных нет - значения полей восстанавливаются из $_POST.
*/
// Значения полей возвращаются в форму как есть, поэтому экранируем: иначе
// отправленная со стороннего сайта форма выполнит свой HTML на странице входа.
$postValue = function ($name) {
    return isset($_POST[$name]) && is_string($_POST[$name])
        ? htmlspecialchars($_POST[$name], ENT_QUOTES, 'UTF-8') : '';
};

$aemail = $postValue('aemail');
$email = $postValue('email');
$firstName = $postValue('firstName');
$lastName = $postValue('lastName');
$nick = $postValue('nick');

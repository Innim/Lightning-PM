<?php /* d-inline, не d-inline-block: перед атомарным строчным боксом (inline-block)

<div class="issue-copy dropdown d-inline"><?php

    ?><a href="javascript:void(0);" class="issue-copy-toggle" data-bs-toggle="dropdown"
        aria-expanded="false" aria-label="Копировать ссылку на задачу"><span
            title="Копировать ссылку на задачу"><i class="fa fa-link" aria-hidden="true"></i></span></a>
    <ul class="dropdown-menu fs-6">
        <li>
            <a class="dropdown-item py-1 px-2" href="javascript:void(0);"
                onclick="issuePage.onClickCopyLinkedIssueTitle(event)"

                data-issue-id-in-project="<?=$idInProject;?>"
                data-issue-name="<?=$issueName;?>">
                <i class="fa fa-arrow-up-right-from-square me-1 fa-xs" aria-hidden="true"></i>
                <small>Копировать гиперссылку</small>
            </a>
        </li>
        <li>
            <a class="dropdown-item py-1 px-2" href="javascript:void(0);"
                onclick="issuePage.onClickCopyIssueUrl(event)"

                <i class="fa fa-link me-1 fa-xs" aria-hidden="true"></i>
                <small>Копировать ссылку</small>
            </a>
        </li>
        <li>
            <a class="dropdown-item py-1 px-2" href="javascript:void(0);"
                onclick="issuePage.onClickCopyMarkdownIssueLink(event)"

                data-issue-id-in-project="<?=$idInProject;?>">
                <i class="fa fa-hashtag me-1 fa-xs" aria-hidden="true"></i>

        </li>
